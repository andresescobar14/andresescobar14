<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Andres Escobar — Full Stack Web Developer</title><desc id="desc">Cabecera azul animada adaptada a pantallas pequeñas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071325"/><stop offset="1" stop-color="#102C59"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#93C5FD" stroke-opacity=".055"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="638" height="358" rx="24"/></clipPath>
  </defs>
  <style>text{font-family:'Segoe UI',Arial,Helvetica,sans-serif}.orbit{transform-origin:570px 190px;animation:orbit 30s linear infinite}.cursor{animation:blink 1.2s steps(2,end) infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@media(prefers-reduced-motion:reduce){.orbit,.cursor{animation:none}}</style>
  <g clip-path="url(#frame)">
    <rect width="640" height="360" fill="url(#bg)"/><rect width="640" height="360" fill="url(#grid)"/>
    <circle cx="570" cy="190" r="200" fill="none" stroke="#60A5FA" stroke-opacity=".09"/>
    <circle cx="570" cy="190" r="155" fill="none" stroke="#60A5FA" stroke-opacity=".08"/>
    <g class="orbit"><circle cx="570" cy="35" r="4" fill="#60A5FA"/><circle cx="415" cy="190" r="2.5" fill="#67E8F9"/></g>
    <rect x="40" y="35" width="40" height="30" rx="8" fill="#173968" stroke="#315384"/>
    <text x="60" y="55" text-anchor="middle" fill="#BFDBFE" font-size="12" font-weight="700">AE</text>
    <text x="94" y="55" fill="#93C5FD" font-size="11" font-weight="600" letter-spacing="2">DESARROLLO WEB</text>
    <text x="38" y="148" fill="#F1F7FF" font-size="56" font-weight="750" letter-spacing="-2.5">Andres Escobar<tspan fill="#60A5FA">.</tspan></text>
    <text x="40" y="193" fill="url(#accent)" font-size="28" font-weight="600">Full Stack Web Developer</text>
    <rect x="40" y="220" width="70" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="40" y="262" fill="#B3C9E5" font-size="19">De la idea al código.</text>
    <text x="40" y="290" fill="#B3C9E5" font-size="19">Del frontend al backend.</text>
    <text x="40" y="332" fill="#7BA5D9" font-size="11" font-weight="600" letter-spacing="1.5">FRONTEND · BACKEND · BASES DE DATOS</text>
    <text x="564" y="317" fill="#315D98" font-size="30" font-weight="600">&lt;/&gt;</text>
    <rect class="cursor" x="582" y="327" width="9" height="3" fill="#60A5FA"/>
  </g>
  <rect x="1" y="1" width="638" height="358" rx="24" fill="none" stroke="#3B82F6" stroke-opacity=".65" stroke-width="1.5"/>
</svg>