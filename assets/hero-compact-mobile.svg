<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Andres Escobar — Full Stack Web Developer</title>
  <desc id="desc">Una entrada suave presenta el nombre y el rol. Un destello azul recorre la cabecera y un trazo luminoso fluye por el borde.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071325"/><stop offset=".55" stop-color="#0B2043"/><stop offset="1" stop-color="#123064"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
    <linearGradient id="sweep"><stop stop-color="#60A5FA" stop-opacity="0"/><stop offset=".5" stop-color="#67E8F9" stop-opacity=".13"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#93C5FD" stroke-opacity=".045"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="638" height="238" rx="20"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}
    .brand{animation:enter .7s cubic-bezier(.2,.7,.3,1) .05s both}
    .name{animation:enter .9s cubic-bezier(.2,.7,.3,1) .18s both}
    .role{animation:enter .9s cubic-bezier(.2,.7,.3,1) .35s both}
    .caption{animation:enter .9s cubic-bezier(.2,.7,.3,1) .55s both}
    .card-entry{animation:enter 1s cubic-bezier(.2,.7,.3,1) .5s both}
    .float{animation:float 6s ease-in-out 1.5s infinite}
    .cursor{animation:blink 1.2s steps(2,end) infinite}
    .scan{animation:scan 9s linear 1.6s infinite;opacity:0}
    .edge{stroke-dasharray:135 1625;animation:edge 11s linear infinite}
    .signal{stroke-dasharray:8 24;animation:signal 8s linear infinite}
    @keyframes enter{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes scan{0%{opacity:0;transform:translateX(-350px)}8%{opacity:.8}44%{opacity:.8}55%,100%{opacity:0;transform:translateX(990px)}}
    @keyframes edge{to{stroke-dashoffset:-1760}}
    @keyframes signal{to{stroke-dashoffset:-256}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="640" height="240" fill="url(#bg)"/>
    <rect width="640" height="240" fill="url(#grid)"/>
    <ellipse cx="600" cy="125" rx="220" ry="210" fill="#2563EB" fill-opacity=".08"/>
    <circle cx="600" cy="123" r="163" fill="none" stroke="#93C5FD" stroke-opacity=".08"/>
    <circle cx="600" cy="123" r="205" fill="none" stroke="#93C5FD" stroke-opacity=".055"/>
    <path d="M370 216H555L585 186H640" fill="none" stroke="#60A5FA" stroke-opacity=".16"/>
    <path class="signal" d="M370 216H555L585 186H640" fill="none" stroke="#60A5FA" stroke-opacity=".65" stroke-width="1.5"/>
    <rect class="scan" x="0" y="0" width="260" height="240" fill="url(#sweep)" transform="skewX(-18)"/>
    <g class="brand">
      <rect x="32" y="25" width="34" height="25" rx="7" fill="#173968" stroke="#315384"/>
      <text x="49" y="41.5" text-anchor="middle" fill="#BFDBFE" font-size="10" font-weight="700" class="mono">AE</text>
      <text x="79" y="42" fill="#93C5FD" font-size="10.5" font-weight="600" letter-spacing="2">DESARROLLO WEB</text>
    </g>
    <g class="name"><text x="30" y="108" fill="#F1F7FF" font-size="54" font-weight="750" letter-spacing="-2.6">Andres Escobar<tspan fill="#60A5FA">.</tspan></text></g>
    <g class="role"><text x="32" y="150" fill="url(#accent)" font-size="26" font-weight="600">Full Stack Web Developer</text></g>
    <g class="caption">
      <rect x="32" y="169" width="42" height="2" rx="1" fill="url(#accent)"/>
      <text x="32" y="202" fill="#A7BEDB" font-size="16">De la idea al código. Del frontend al backend.</text>
    </g>
    
  </g>
  <rect x="1" y="1" width="638" height="238" rx="20" fill="none" stroke="#3968A7" stroke-opacity=".65"/>
  <rect class="edge" x="1" y="1" width="638" height="238" rx="20" fill="none" stroke="#7DD3FC" stroke-opacity=".75" stroke-width="1.6"/>
</svg>