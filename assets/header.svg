<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Andres Escobar — Full Stack Web Developer</title>
  <desc id="desc">Cabecera azul con una ventana de código, órbitas y luces animadas. De la idea al código. Del frontend al backend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071325"/><stop offset=".54" stop-color="#0B2043"/><stop offset="1" stop-color="#102C59"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#2563EB" stop-opacity=".7"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".25"/><stop offset="1" stop-color="#3B82F6" stop-opacity=".65"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2563EB" stop-opacity=".3"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#93C5FD" stroke-opacity=".055"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="378" rx="24"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Arial,Helvetica,sans-serif}
    .mono{font-family:Consolas,'Liberation Mono',monospace}
    .orbit{transform-origin:949px 190px;animation:orbit 36s linear infinite}
    .float{animation:float 7s ease-in-out infinite}
    .pulse{animation:pulse 4s ease-in-out infinite}
    .pulse-delayed{animation:pulse 4s ease-in-out 2s infinite}
    .cursor{animation:blink 1.15s steps(2,end) infinite}
    .signal{stroke-dasharray:5 19;animation:signal 7s linear infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes signal{to{stroke-dashoffset:-144}}
    @media(prefers-reduced-motion:reduce){.orbit,.float,.pulse,.pulse-delayed,.cursor,.signal{animation:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <ellipse cx="970" cy="175" rx="390" ry="360" fill="url(#glow)"/>
    <circle cx="949" cy="190" r="171" fill="none" stroke="#60A5FA" stroke-opacity=".1"/>
    <circle cx="949" cy="190" r="211" fill="none" stroke="#60A5FA" stroke-opacity=".07"/>
    <g class="orbit">
      <circle cx="949" cy="19" r="5" fill="#60A5FA"/>
      <circle cx="778" cy="190" r="3.5" fill="#67E8F9"/>
      <circle cx="1097" cy="276" r="4" fill="#93C5FD"/>
    </g>
    <path d="M698 329H878L912 295H1190" fill="none" stroke="#38BDF8" stroke-opacity=".18"/>
    <path class="signal" d="M698 329H878L912 295H1190" fill="none" stroke="#60A5FA" stroke-width="2"/>
    <rect x="60" y="51" width="45" height="32" rx="9" fill="#1D4ED8" fill-opacity=".34" stroke="#60A5FA" stroke-opacity=".28"/>
    <text x="82.5" y="72" fill="#BFDBFE" font-size="13" font-weight="700" text-anchor="middle" class="mono">AE</text>
    <text x="119" y="72" fill="#93C5FD" font-size="12" font-weight="600" letter-spacing="2.1">DESARROLLO WEB</text>
    <text x="58" y="173" fill="#F1F7FF" font-size="64" font-weight="750" letter-spacing="-2.8">Andres Escobar<tspan fill="#60A5FA">.</tspan></text>
    <text x="62" y="219" fill="url(#accent)" font-size="26" font-weight="600" letter-spacing=".1">Full Stack Web Developer</text>
    <rect x="62" y="244" width="72" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="62" y="282" fill="#A7BEDB" font-size="17">De la idea al código. Del frontend al backend.</text>
    <g fill="#7BA5D9" font-size="11.5" font-weight="600" letter-spacing="1.6">
      <text x="62" y="334">FRONTEND</text><circle cx="158" cy="330" r="2" fill="#38BDF8"/>
      <text x="174" y="334">BACKEND</text><circle cx="264" cy="330" r="2" fill="#38BDF8"/>
      <text x="280" y="334">BASES DE DATOS</text>
    </g>
    <g class="float">
      <rect x="756" y="89" width="379" height="223" rx="15" fill="#030B18" fill-opacity=".27"/>
      <rect x="752" y="81" width="379" height="223" rx="15" fill="#0A172B" stroke="#315384"/>
      <path d="M768 81H1115Q1131 81 1131 97V122H752V97Q752 81 768 81" fill="#10223D"/>
      <circle cx="775" cy="102" r="4" fill="#3B82F6"/><circle cx="791" cy="102" r="4" fill="#60A5FA"/><circle cx="807" cy="102" r="4" fill="#93C5FD"/>
      <text x="937" y="106" text-anchor="middle" class="mono" fill="#8FAED5" font-size="11.5">andres.js</text>
      <g class="mono" font-size="15" xml:space="preserve">
        <text x="778" y="158"><tspan fill="#93C5FD">const </tspan><tspan fill="#E2EFFF">developer </tspan><tspan fill="#7DD3FC">= {</tspan></text>
        <text x="797" y="187"><tspan fill="#A8BAD6">frontend: </tspan><tspan fill="#67E8F9">"React + Next.js"</tspan><tspan fill="#94A3B8">,</tspan></text>
        <text x="797" y="216"><tspan fill="#A8BAD6">backend:  </tspan><tspan fill="#67E8F9">"Node + Python"</tspan><tspan fill="#94A3B8">,</tspan></text>
        <text x="797" y="245"><tspan fill="#A8BAD6">data:     </tspan><tspan fill="#67E8F9">"SQL + NoSQL"</tspan></text>
        <text x="778" y="274" fill="#7DD3FC">};</text>
        <rect class="cursor" x="803" y="261" width="8" height="16" rx="1" fill="#60A5FA"/>
      </g>
    </g>
    <circle class="pulse" cx="701" cy="91" r="3" fill="#67E8F9"/>
    <circle class="pulse-delayed" cx="1170" cy="207" r="3" fill="#60A5FA"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="24" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>