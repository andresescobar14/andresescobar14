<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="32" viewBox="0 0 1200 32" role="img" aria-labelledby="title desc">
  <title id="title">Separador azul animado</title><desc id="desc">Una línea azul animada acompaña el cierre del perfil de Andres Escobar.</desc>
  <defs><linearGradient id="line"><stop stop-color="#2563EB" stop-opacity="0"/><stop offset=".25" stop-color="#3B82F6"/><stop offset=".5" stop-color="#67E8F9"/><stop offset=".75" stop-color="#3B82F6"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></linearGradient></defs>
  <style>.flow{stroke-dasharray:40 1160;animation:flow 9s linear infinite}@keyframes flow{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  <path d="M0 16H1200" fill="none" stroke="url(#line)" stroke-opacity=".4"/>
  <path class="flow" d="M0 16H1200" fill="none" stroke="#60A5FA" stroke-width="2"/>
</svg>